name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release what was merged into main
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.29.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Work out the release from the commits since the last tag
        id: plan
        run: node scripts/release/release.mts plan --notes-file "$RUNNER_TEMP/release-notes.md"

      - if: steps.plan.outputs.release == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.plan.outputs.release == 'true'
        run: pnpm run typecheck
      - name: Lint
        if: steps.plan.outputs.release == 'true'
        run: pnpm exec oxlint
      - name: Check formatting
        if: steps.plan.outputs.release == 'true'
        run: pnpm exec oxfmt --check
      - if: steps.plan.outputs.release == 'true'
        run: pnpm test

      - name: Set the release version and changelog
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release/release.mts apply "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
      - if: steps.plan.outputs.release == 'true'
        run: pnpm run make
      - name: Check the app was built as the release version
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          built=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' out/mboard-darwin-arm64/mboard.app/Contents/Info.plist)
          if [ "$built" != "$VERSION" ]; then
            echo "::error::The app was built as $built, not $VERSION."
            exit 1
          fi
          test -f "out/make/zip/darwin/arm64/mboard-darwin-arm64-${VERSION}.zip"

      - name: Publish the GitHub release with the zip
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gh release create "$TAG" "out/make/zip/darwin/arm64/mboard-darwin-arm64-${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Commit the version and changelog for main
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --quiet origin main
          git checkout --quiet --force --detach FETCH_HEAD
          node scripts/release/release.mts apply "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          pnpm exec oxfmt package.json
          git add package.json CHANGELOG.md
          git commit --quiet -m "chore(release): $VERSION"
      - name: Push it to main
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push --quiet "$remote" HEAD:main; then exit 0; fi
            echo "main moved on while releasing; rebasing and trying again ($attempt of 3)."
            git pull --quiet --rebase "$remote" main
          done
          echo "::warning::v$VERSION is released, but main's package.json and CHANGELOG.md weren't updated."
          exit 1
