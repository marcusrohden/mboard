# Checks every package in pnpm-lock.yaml against the npm advisory database once a week, catching
# advisories published after a dependency was merged. It doesn't depend on the repo's Dependabot settings,
# and it doesn't run on pull requests, so an existing advisory never blocks unrelated work.
name: Dependency audit

on:
  # Mondays at 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'
  # Run it by hand from the Actions tab.
  workflow_dispatch:

# No token permissions by default; the job asks only for what it needs.
permissions: {}

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Same pinned toolchain as pr.yml and release.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.29.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Reads the lockfile only; nothing is installed. Fails on high and critical advisories.
      - name: Audit dependencies
        run: pnpm audit --audit-level high
